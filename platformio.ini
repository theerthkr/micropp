; PlatformIO Project Configuration File
; Micro-PP Autonomous Maze-Solving Robot
; Target: ESP32 DevKit V1
; Framework: Arduino

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -O2

; Library dependencies
lib_deps =

; Upload settings
upload_speed = 921600

; Partition scheme (default 4MB flash)
board_build.partitions = default.csv
